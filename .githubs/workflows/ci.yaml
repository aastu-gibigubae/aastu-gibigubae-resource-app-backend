name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:

  unit:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  db-tests:
    name: Integration & e2e tests
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aastu_gibigubae_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
 
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aastu_gibigubae_ci
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      R2_ACCOUNT_ID: ci-account-id
      R2_ACCESS_KEY_ID: ci-access-key-id
      R2_SECRET_ACCESS_KEY: ci-secret-access-key
      R2_BUCKET_NAME: ci-bucket
      R2_PUBLIC_URL: https://files.ci.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy


      - run: npx vitest run --config vitest.integration.config.ts
      - run: npx vitest run --config vitest.e2e.config.ts
