services:
  - type: web
    name: aastu-gibigubae-resource-app-backend
    runtime: node
    plan: free 
    region: frankfurt 
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
        
      - key: DATABASE_URL
        sync: false # set  Neon production connection string in the Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true 
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
