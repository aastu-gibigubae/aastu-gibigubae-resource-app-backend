name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Fast Validation, Linting, & Unit Tests (No Database Required)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Formatting Check 
        run: npm run format:check

      - name: Run Linter 
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Build & Type-check
        run: npm run build

      - name: Run unit tests
        run: npm test

  # 2. Integration & E2E Tests (Shared Postgres Database)
  integration-and-e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_ACCESS_SECRET: ci-dummy-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret-min-32-chars-long
      R2_ACCOUNT_ID: dummy-r2-account-id
      R2_ACCESS_KEY_ID: dummy-r2-access-key-id
      R2_SECRET_ACCESS_KEY: dummy-r2-secret-access-key
      R2_BUCKET_NAME: dummy-r2-bucket
      R2_PUBLIC_URL: https://files.ci.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.ts

      #  Run all E2E tests (Mock R2 via MSW or environment variables inside the test setup)
      - name: Run e2e tests
        run: npx vitest run --config vitest.e2e.config.ts

  # 3. Continuous Deployment (Triggers on Main Branch Merge Only)
  deploy:
    runs-on: ubuntu-latest
    needs: integration-and-e2e-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: curl "-f" "-X" POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
